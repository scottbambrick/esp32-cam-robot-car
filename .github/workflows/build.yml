name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Code style: ESPHome's (Google-based) .clang-format for the C++ and ruff for the Python.
    # If anything is off, the format-fixes artifact holds a patch with the formatters' changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the formatters
        run: pip install "clang-format==13.0.1" "ruff==0.16.10"
      - name: Run the formatters
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.ino' ':!include/icons.h' ':!include/index_html.h' | xargs -r clang-format -i --style=file
          ruff check --fix --exit-zero --quiet .
          ruff format --quiet .
          git diff > format-fixes.patch
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: format-fixes
          path: format-fixes.patch
      - name: Check formatting
        run: git diff --stat --exit-code
      - name: Python lint (ruff check)
        if: ${{ !cancelled() }}
        run: ruff check --output-format=github .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # The real secrets files are git-ignored; build with the examples
      - run: |
          cp include/secrets.example.h include/secrets.h
          cp secrets.example.ini secrets.ini
      - run: pio run -e esp32cam
