name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # The real secrets files are git-ignored; build with the examples
      - run: |
          cp include/secrets.example.h include/secrets.h
          cp secrets.example.ini secrets.ini
      - run: pio run -e esp32cam
