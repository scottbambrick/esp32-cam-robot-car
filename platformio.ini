; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; holds the OTA password; copy secrets.example.ini to create it
extra_configs = secrets.ini

; USB upload (needs IO0 jumpered to GND and a reset)
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; two app slots so the firmware can be updated over Wi-Fi
board_build.partitions = min_spiffs.csv

; Wi-Fi upload: pio run -e ota -t upload
[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = robot.local
upload_flags = --auth=${secrets.ota_password}
